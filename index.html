<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d22">
  <title>Deportes Hoy - Horario Argentina</title>
  <meta name="description" content="Partidos, resultados y posiciones del día con horario de Argentina: Liga Profesional, copas, Europa, selecciones europeas y sudamericanas, y Los Pumas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="accent-bar"></div>
    <img src="logo.jpg" alt="Argentina Fulbo" class="brand-logo">
    <div class="header-meta">
      <div class="header-clock">
        <i data-lucide="clock-3"></i><span id="clock"></span>
      </div>
      <a href="#posiciones" class="header-link">
        Ver posiciones <i data-lucide="arrow-down"></i>
      </a>
    </div>
  </header>

  <nav id="filters" class="filters-nav" aria-label="Competencias"></nav>

  <main class="wrap" style="padding-top: 1.25rem; padding-bottom: 4rem;">

    
    <div class="stats-grid">
      <div class="stat-card">
        <i data-lucide="layers" style="color: var(--muted);"></i>
        <strong id="statTotal" class="num">0</strong>
        <span class="label">Total</span>
      </div>
      <div class="stat-card live">
        <i data-lucide="radio" style="color: var(--live);"></i>
        <strong id="statLive" class="num">0</strong>
        <span class="label">En vivo</span>
      </div>
      <div class="stat-card">
        <i data-lucide="clock" style="color: var(--gold);"></i>
        <strong id="statUpcoming" class="num">0</strong>
        <span class="label">Próximos</span>
      </div>
      <div class="stat-card finished">
        <i data-lucide="check-check" style="color: #34d399;"></i>
        <strong id="statFinished" class="num">0</strong>
        <span class="label">Finalizados</span>
      </div>
    </div>


    <div id="days" class="days-row" role="tablist" aria-label="Día"></div>

    <div class="chips-wrap">
      <div id="chips" class="chips" role="group" aria-label="Estado">
        <button type="button" class="chip" data-status="all">Todos</button>
        <button type="button" class="chip" data-status="live">En vivo</button>
        <button type="button" class="chip" data-status="upcoming">Próximos</button>
        <button type="button" class="chip" data-status="finished">Finalizados</button>
      </div>
    </div>

    <div id="warning" class="warning hidden"></div>

    <div id="content" aria-live="polite"></div>

    <section id="posiciones" class="standings-section" style="scroll-margin-top: 4rem;">
      <div class="standings-header">
        <i data-lucide="trophy"></i>
        <h2>Posiciones</h2>
      </div>
      <div id="standings"></div>
    </section>

    <footer class="site-footer">
      <p>Datos de ESPN · Se actualiza solo (30 s en vivo, 60 s el resto) · Horarios de Argentina (UTC-3)</p>
      <p id="updatedAt" style="margin-top: .25rem;"></p>
      <details>
        <summary>Detalle de fuentes</summary>
        <ul id="diagList"></ul>
      </details>
    </footer>
  </main>

  <noscript><p style="padding: 1.5rem; text-align: center;">Esta página necesita JavaScript.</p></noscript>

</body>
</html>
