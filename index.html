<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d22">
  <title>Deportes Hoy - Horario Argentina</title>
  <meta name="description" content="Partidos, resultados y posiciones del día con horario de Argentina: Liga Profesional, copas, Europa, selecciones europeas y sudamericanas, y Los Pumas.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>

  <style>
    /* ============ Variables ============ */
    :root {
      --ink: #070d22;
      --panel: #101a3d;
      --panel2: #18265a;
      --line: #26377a;
      --celeste: #75aadb;
      --gold: #f6b40e;
      --live: #ff5d73;
      --white: #eef3ff;
      --muted: #94a3b8;
      --radius: 16px;
      --shadow-live: 0 8px 24px -8px rgba(255, 93, 115, .35);
      --shadow-card: 0 2px 8px -2px rgba(0, 0, 0, .35);
      --font-display: "Barlow Condensed", Impact, sans-serif;
      --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    /* ============ Reset ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--ink); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      background-color: var(--ink);
      background-image: radial-gradient(900px 420px at 50% -140px, rgba(27, 58, 122, .75), transparent);
      background-attachment: fixed;
      color: var(--white);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    img { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; }
    h1, h2, h3, h4 { margin: 0; }
    p { margin: 0; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ============ Utilidades ============ */
    .wrap { width: 100%; max-width: 48rem; margin-inline: auto; padding-inline: 1rem; }
    .hidden { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ============ Header ============ */
    .site-header {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(to bottom, #16296a, #0d1745);
      display: flex;
      align-items: center;
      justify-content: space-around;  /* <-- space-around */
      gap: .75rem;
      padding: .5rem 1rem;
      min-height: 88px;
    }
    .site-header::before {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: .07;
      pointer-events: none;
    }
    .site-header .accent-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--celeste), #fff, var(--celeste));
    }

    /* Logo: SIN flex-grow, para que space-around funcione */
    .brand-logo {
      display: block;
      height: 76px;
      width: auto;
      max-width: 100%;
      flex: 0 0 auto;
      object-fit: contain;
      object-position: left center;
    }

    /* El reloj NUNCA se comprime */
    .header-meta {
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: .25rem;
      flex: 0 0 auto;
    }

    .header-clock {
      display: flex; align-items: center; gap: .25rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--celeste);
      white-space: nowrap;
    }
    .header-clock svg { width: 1rem; height: 1rem; flex-shrink: 0; }
    .header-link {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .75rem; font-weight: 600;
      color: #cbd5e1; text-decoration: none;
      transition: color .15s;
    }
    .header-link:hover { color: #fff; }
    .header-link svg { width: .875rem; height: .875rem; }

    @media (min-width: 421px) {
      .brand-logo { height: 110px; }
    }
    @media (min-width: 640px) {
      .site-header { min-height: 120px; padding-block: .75rem; }
      .header-meta { display: flex; }
    }

    /* ============ Nav filtros ============ */
    .filters-nav {
      position: sticky; top: 0; z-index: 30;
      display: flex; gap: .5rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 13, 34, .85);
      backdrop-filter: blur(8px);
      padding: .625rem 1rem;
      scrollbar-width: none;
    }
    .filters-nav::-webkit-scrollbar { display: none; }

    .filter-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      flex-shrink: 0;
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .375rem .875rem .375rem .625rem;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--white);
      background: var(--panel);
      transition: border-color .15s, transform .15s, background .15s, color .15s;
    }
    .filter-btn:hover { border-color: var(--celeste); transform: translateY(-1px); }
    .filter-btn.is-active {
      background: linear-gradient(135deg, var(--celeste), #a9ccee);
      color: var(--ink);
      border-color: transparent;
      box-shadow: 0 8px 20px -8px rgba(117, 170, 219, .6);
    }
    .filter-btn img, .filter-btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }
    .filter-btn img { width: 22px; height: 15px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }

    /* ============ Stats (solo desktop) ============ */
    .stats-grid {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: .375rem;
      margin-bottom: .75rem;
    }
    @media (min-width: 640px) {
      .stats-grid { display: grid; }
    }
    .stat-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: .375rem .25rem;
      text-align: center;
    }
    .stat-card svg { width: .875rem; height: .875rem; margin-inline: auto; }
    .stat-card .num {
      display: block;
      margin-top: .125rem;
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-card .label { font-size: .625rem; color: var(--muted); }
    .stat-card.live .num { color: var(--live); }
    .stat-card.finished .num { color: #cbd5e1; }

    /* ============ Días ============ */
    .days-row {
      display: flex; gap: .5rem;
      overflow-x: auto;
      padding-bottom: .25rem;
      margin-bottom: 1rem;
      scrollbar-width: none;
    }
    .days-row::-webkit-scrollbar { display: none; }
    .day-btn {
      flex-shrink: 0;
      min-width: 4.8rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--white);
      padding: .375rem .75rem;
      text-align: center;
      line-height: 1.2;
      transition: border-color .15s, background .15s;
    }
    .day-btn:hover { border-color: var(--celeste); }
    .day-btn small { display: block; font-size: .6875rem; color: var(--muted); }
    .day-btn strong { font-size: .8125rem; font-weight: 700; }
    .day-btn.is-active { background: var(--gold); border-color: var(--gold); color: #1c1500; }
    .day-btn.is-active small { color: rgba(28, 21, 0, .7); }

    /* ============ Chips estado ============ */
    .chips-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    .chips {
      display: inline-flex;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 4px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: .375rem .875rem;
      font-size: .75rem;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .chip:hover { color: #fff; }
    .chip.is-active { background: var(--celeste); color: var(--ink); }

    /* ============ Warning ============ */
    .warning {
      margin-bottom: 1rem;
      border: 1px solid rgba(246, 180, 14, .5);
      background: rgba(246, 180, 14, .1);
      color: #fcd34d;
      border-radius: 12px;
      padding: .5rem .75rem;
      font-size: .8125rem;
    }

    /* ============ Match rows ============ */
    .comp-block { margin-bottom: 2.25rem; }
    .section-title {
      display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    @media (min-width: 640px) { .section-title { font-size: 1.5rem; } }
    .section-title img { width: 22px; height: 15px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
    .section-title .count { font-family: var(--font-sans); font-size: .875rem; font-weight: 600; color: var(--muted); }

    .badge-live {
      display: inline-flex; align-items: center; gap: .25rem;
      border-radius: 999px;
      background: rgba(255, 93, 115, .15);
      padding: .125rem .5rem;
      font-size: .6875rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--live);
    }
    .badge-live::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--live);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .note {
      margin-top: .5rem;
      border: 1px dashed var(--line);
      background: rgba(16, 26, 61, .5);
      border-radius: 12px;
      padding: .5rem .75rem;
      font-size: .875rem;
      color: var(--muted);
    }

    .matches-list { display: flex; flex-direction: column; gap: .5rem; margin-top: .625rem; }

    .match {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: .625rem .75rem;
      transition: border-color .15s, transform .15s;
    }
    .match:hover { border-color: var(--celeste); }
    .match.is-live {
      border-color: rgba(255, 93, 115, .7);
      background: linear-gradient(to right, rgba(255, 93, 115, .15), var(--panel));
      box-shadow: var(--shadow-live);
    }
    .match-meta {
      display: flex; align-items: baseline; gap: .5rem;
      margin-bottom: .5rem;
    }
    .match-time {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .match.is-live .match-time { color: var(--live); }
    .match-date-tag { font-size: .75rem; font-weight: 700; color: var(--gold); }
    .match-venue {
      margin-left: auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .6875rem;
      color: var(--muted);
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .5rem;
    }
    .team {
      display: flex; align-items: center; gap: .5rem;
      min-width: 0;
      font-size: .8125rem;
    }
    @media (min-width: 640px) { .team { font-size: .875rem; } }
    .team.away { justify-content: flex-end; text-align: right; }
    .team .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #e2e8f0;
    }
    .team.is-winner .name { font-weight: 800; color: #fff; }
    .team img {
      width: 28px; height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }
    @media (min-width: 640px) { .team img { width: 32px; height: 32px; } }

    .score-box { min-width: 4.6rem; text-align: center; }
    .score-vs {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
    }
    .score-line {
      display: block;
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .02em;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .match.is-live .score-line { color: var(--live); }
    .score-detail {
      display: block;
      margin-top: .25rem;
      font-size: .6875rem;
      color: var(--muted);
    }
    .match.is-live .score-detail { color: var(--live); font-weight: 700; }

    /* ============ Resultados (últimos) ============ */
    .results-block { margin-top: 1.5rem; border-top: 1px solid rgba(38, 55, 122, .6); padding-top: 1rem; }
    .results-block h3 {
      display: flex; align-items: center; gap: .5rem;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #cbd5e1;
    }
    .results-block h3 svg { width: 1rem; height: 1rem; flex-shrink: 0; color: var(--muted); }
    .results-empty { padding-top: .5rem; font-size: .875rem; color: var(--muted); }

    /* ============ Empty states ============ */
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--muted);
    }
    .empty-state strong { display: block; margin-bottom: .25rem; color: #e2e8f0; }

    /* ============ Skeleton ============ */
    .skeleton {
      height: 4rem;
      border-radius: var(--radius);
      background: var(--panel);
      margin-bottom: .5rem;
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ============ Posiciones ============ */
    .standings-section { margin-top: 1rem; }
    .standings-header {
      display: flex; align-items: center; gap: .625rem;
      border-top: 1px solid var(--line);
      padding-top: 2rem;
      margin-bottom: 1rem;
    }
    .standings-header svg { width: 1.5rem; height: 1.5rem; color: var(--gold); }
    .standings-header h2 {
      font-family: var(--font-display);
      font-size: 1.875rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .standings-card {
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      background: rgba(16, 26, 61, .6);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .standings-card summary {
      display: flex; align-items: center; gap: .625rem;
      padding: .75rem 1rem;
      cursor: pointer;
      list-style: none;
    }
    .standings-card summary::-webkit-details-marker { display: none; }
    .standings-card summary img { width: 22px; height: 15px; border-radius: 3px; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
    .standings-card summary .comp-name {
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .standings-card summary .chev {
      margin-left: auto;
      color: var(--muted);
      transition: transform .2s;
    }
    .standings-card summary .chev svg { width: 1.25rem; height: 1.25rem; }
    .standings-card[open] summary .chev { transform: rotate(180deg); }
    .standings-body { border-top: 1px solid rgba(38, 55, 122, .6); }
    .standings-msg { padding: 1rem; font-size: .875rem; color: var(--muted); }

    .standings-table-wrap { overflow-x: auto; }
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }
    .standings-table th {
      padding: .5rem .375rem;
      font-size: .6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      text-align: center;
    }
    .standings-table th.col-team { text-align: left; padding-inline: .5rem; }
    .standings-table th.col-rank { width: 2rem; }
    .standings-table th.wide { display: none; }
    @media (min-width: 640px) { .standings-table th.wide { display: table-cell; } }

    .standings-table td {
      padding: .5rem .375rem;
      text-align: center;
      color: #cbd5e1;
      border-top: 1px solid rgba(38, 55, 122, .6);
    }
    .standings-table td.col-team {
      width: 100%;
      max-width: 0;
      padding-inline: .5rem;
      text-align: left;
    }
    .standings-table td.col-rank { font-size: .75rem; font-weight: 700; color: #cbd5e1; }
    .standings-table td.wide { display: none; }
    @media (min-width: 640px) { .standings-table td.wide { display: table-cell; } }
    .standings-table td.strong { font-weight: 800; color: #fff; }
    .standings-table tr:hover { background: rgba(24, 38, 90, .6); }
    .standings-table .team-cell { display: flex; align-items: center; gap: .5rem; min-width: 0; }
    .standings-table .team-cell img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .standings-table .team-cell span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: #f1f5f9;
    }

    .standings-legend {
      display: flex; flex-wrap: wrap; gap: .25rem 1rem;
      border-top: 1px solid rgba(38, 55, 122, .6);
      padding: .5rem .75rem;
      font-size: .6875rem;
      color: var(--muted);
      list-style: none;
      margin: 0;
    }
    .standings-legend li { display: flex; align-items: center; gap: .375rem; }
    .standings-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

    .group-title {
      background: rgba(24, 38, 90, .5);
      padding: .375rem 1rem;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #cbd5e1;
    }

    /* ============ Footer ============ */
    .site-footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
    }
    .site-footer details { margin-top: .75rem; text-align: left; }
    .site-footer summary { cursor: pointer; text-align: center; }
    .site-footer ul { margin-top: .5rem; padding-left: 1.25rem; list-style: disc; }
    .site-footer li { margin-bottom: .125rem; }
    .site-footer li.error { color: #fca5a5; }

    /* ============ Animaciones reduced-motion ============ */
    @media (prefers-reduced-motion: reduce) {
      .animate__animated { animation: none !important; }
      html { scroll-behavior: auto; }
    }

    /* ============ Scroll snap móvil ============ */
    @media (max-width: 420px) {
      .filters-nav, .days-row { scroll-snap-type: x proximity; }
      .filter-btn, .day-btn { scroll-snap-align: start; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="accent-bar"></div>
    <img src="logo.jpg" alt="Argentina Fulbo" class="brand-logo">
    <div class="header-meta">
      <div class="header-clock">
        <i data-lucide="clock-3"></i><span id="clock"></span>
      </div>
      <a href="#posiciones" class="header-link">
        Ver posiciones <i data-lucide="arrow-down"></i>
      </a>
    </div>
  </header>

  <nav id="filters" class="filters-nav" aria-label="Competencias"></nav>

  <main class="wrap" style="padding-top: 1.25rem; padding-bottom: 4rem;">

    <div class="stats-grid">
      <div class="stat-card">
        <i data-lucide="layers" style="color: var(--muted);"></i>
        <strong id="statTotal" class="num">0</strong>
        <span class="label">Total</span>
      </div>
      <div class="stat-card live">
        <i data-lucide="radio" style="color: var(--live);"></i>
        <strong id="statLive" class="num">0</strong>
        <span class="label">En vivo</span>
      </div>
      <div class="stat-card">
        <i data-lucide="clock" style="color: var(--gold);"></i>
        <strong id="statUpcoming" class="num">0</strong>
        <span class="label">Próximos</span>
      </div>
      <div class="stat-card finished">
        <i data-lucide="check-check" style="color: #34d399;"></i>
        <strong id="statFinished" class="num">0</strong>
        <span class="label">Finalizados</span>
      </div>
    </div>

    <div id="days" class="days-row" role="tablist" aria-label="Día"></div>

    <div class="chips-wrap">
      <div id="chips" class="chips" role="group" aria-label="Estado">
        <button type="button" class="chip" data-status="all">Todos</button>
        <button type="button" class="chip" data-status="live">En vivo</button>
        <button type="button" class="chip" data-status="upcoming">Próximos</button>
        <button type="button" class="chip" data-status="finished">Finalizados</button>
      </div>
    </div>

    <div id="warning" class="warning hidden"></div>

    <div id="content" aria-live="polite"></div>

    <section id="posiciones" class="standings-section" style="scroll-margin-top: 4rem;">
      <div class="standings-header">
        <i data-lucide="trophy"></i>
        <h2>Posiciones</h2>
      </div>
      <div id="standings"></div>
    </section>

    <footer class="site-footer">
      <p>Datos de ESPN · Se actualiza solo (30 s en vivo, 60 s el resto) · Horarios de Argentina (UTC-3)</p>
      <p id="updatedAt" style="margin-top: .25rem;"></p>
      <details>
        <summary>Detalle de fuentes</summary>

  var FLAG_BASE = "https://flagcdn.com/w40/";

    "japan": "jp", "france": "fr", "fiji": "fj", "england": "gb-eng", "australia": "au",

    "spain": "es", "germany": "de", "portugal": "pt", "usa": "us", "united states": "us"
  };
  function flagUrl(code, color) {

      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="' + (color || "#94a3b8") + '"/>' +
        '<g fill="none" stroke="#0a1128" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3.6 3.2 13.4 0 17M12 3.5c-3.2 3.6-3.2 13.4 0 17"/></g></svg>';

  }
  function flagForName(name) { return flagUrl(COUNTRY_FLAGS[String(name || "").toLowerCase().trim()]); }

  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtTime = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtDay = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric" });

  function dayKeyOf(date) { return fmtKey.format(date); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function addDays(key, n) {
    var p = key.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));

  }

  }

  var STATE_ES = {
    "HT": "Entretiempo", "Halftime": "Entretiempo", "FT": "Final", "Final": "Final",
    "FT-Pens": "Final (penales)", "AET": "Final (alargue)", "Final/OT": "Final (alargue)",
    "Full Time": "Final", "Half Time": "Entretiempo"
  };
  function es(txt) { return STATE_ES[txt] || txt; }

  function parseStatus(st) {
    var type = (st && st.type) || {};
    var name = String(type.name || "").toUpperCase();
    var state = String(type.state || "").toLowerCase();
    var short = type.shortDetail || "";

    if (name.indexOf("POSTPONED") > -1) return { status: "upcoming", detail: "Postergado" };
    if (name.indexOf("CANCEL") > -1) return { status: "upcoming", detail: "Cancelado" };
    if (name.indexOf("SUSPENDED") > -1) return { status: "finished", detail: "Suspendido" };
    if (name.indexOf("ABANDONED") > -1) return { status: "finished", detail: "Abandonado" };
    if (name.indexOf("DELAYED") > -1 && state !== "in") return { status: "upcoming", detail: "Demorado" };

  function parseEvent(ev, comp) {

    if (!c || !c.competitors || c.competitors.length < 2) return null;

    var home = c.competitors.find(function (x) { return x.homeAway === "home"; }) || c.competitors[0];
    var away = c.competitors.find(function (x) { return x.homeAway === "away"; }) || c.competitors[1];

    function names(x) {
      var t = x.team || {};
      return [t.displayName, t.shortDisplayName, t.name, t.abbreviation].filter(Boolean).join(" ");
    }
    if (comp.teamFilter && !comp.teamFilter.test(names(home) + " " + names(away))) return null;

    var when = new Date(ev.date);
    if (isNaN(when)) return null;

    var s = parseStatus(ev.status);
    var detail = s.detail;
    var hasPens = home.shootoutScore !== undefined && away.shootoutScore !== undefined;
    if (hasPens) detail = (detail ? detail + " " : "") + "(pen. " + home.shootoutScore + "-" + away.shootoutScore + ")";

    function team(x) {
      var t = x.team || {};
      var nm = t.shortDisplayName || t.displayName || t.name || "A definir";
      var flag = comp.rugby ? flagForName(t.displayName || nm) : "";

      id: comp.id + "-" + ev.id,
      comp: comp,
      ts: when.getTime(),
      dayKey: dayKeyOf(when),
      time: fmtTime.format(when),
      status: s.status,
      detail: detail,
      venue: c.venue && c.venue.fullName,
      home: team(home),
      away: team(away)

  }

  var rangeSupported = true;

  function scoreboard(src, fromKey, toKey, ttl) {
    function one(dates) { return fetchJson(ESPN + src + "/scoreboard?dates=" + dates + "&limit=300", ttl); }
    function merge(list) {
      var ok = list.filter(Boolean);
      if (!ok.length) throw new Error("sin respuesta");
      return { events: [].concat.apply([], ok.map(function (r) { return r.events || []; })) };
    }
    function split() {
      var keys = [], k = fromKey, months = {};
      while (k <= toKey) { keys.push(k); months[k.slice(0, 4) + k.slice(5, 7)] = 1; k = addDays(k, 1); }

  function loadCompetition(comp, fromKey, toKey, ttl, label) {

    return Promise.all(comp.sources.map(function (src) {

  function statOf(entry, names, abbr) {

    for (var i = 0; i < stats.length; i++) {

    }
    for (var j = 0; j < stats.length; j++) {

  }

  function parseStandings(data) {

    function walk(node, name) {
      var entries = node && node.standings && node.standings.entries;
      if (entries && entries.length) {
        var rows = entries.map(function (en, i) {
          var t = en.team || {};
          var rank = statOf(en, ["rank"], null);
          var pts = statOf(en, ["points"], ["P", "PTS"]);
          return {
            pos: rank && rank.value != null ? Number(rank.value) : i + 1,
            hasRank: !!(rank && rank.value != null),
            pts: pts && pts.value != null ? Number(pts.value) : 0,
            name: t.shortDisplayName || t.displayName || t.name || "Equipo",
            logo: (t.logos && t.logos[0] && t.logos[0].href) || t.logo || "",
            note: en.note && en.note.description ? { color: en.note.color || "", text: en.note.description } : null,
            cells: COLS.map(function (c) { return statText(statOf(en, c.names, c.abbr)); })
          };
        });
        if (rows.every(function (r) { return r.hasRank; })) rows.sort(function (a, b) { return a.pos - b.pos; });
        else rows.sort(function (a, b) { return b.pts - a.pts; });
        groups.push({ name: name || "", rows: rows });

  var LIVE_TTL = 20000;
  var SLOW_TTL = 300000;
  var TABLE_TTL = 600000;

  var state = {
    tab: "Todos",
    dayKey: todayKey(),
    statusFilter: "all",
    events: [],
    upcoming: {},
    results: [],
    tables: {},
    tableDiag: {},
    closed: {},
    failedIds: {},
    failed: [],
    diag: [],
    loaded: false,
    token: 0,
    timer: null,
    updated: null
  };

  function isRange() { return state.tab === "Pumas"; }
  function compsForTab() {
    return COMPETITIONS.filter(function (c) { return state.tab === "Todos" || c.tab === state.tab; });
  }
  function byTs(a, b) { return a.ts - b.ts; }

  function load(showSkeleton) {
    var token = ++state.token;
    if (showSkeleton) { state.loaded = false; render(); }

    var today = todayKey(), dayKey = state.dayKey, range = isRange(), comps = compsForTab();

    var dayP = Promise.all(comps.map(function (c) { return loadCompetition(c, from, to, range ? SLOW_TTL : LIVE_TTL); }));
    var resP = range ? Promise.resolve([]) : Promise.all(comps.filter(function (c) { return !c.noResults; }).map(function (c) {
      return loadCompetition(c, addDays(today, -29), today, SLOW_TTL, " (resultados)");
    }));

    Promise.all([dayP, resP]).then(function (both) {
      if (token !== state.token) return;
      var events = [], failed = [], failedIds = {}, diag = [], empties = [];

        else if (!r.events.length && !range) empties.push(r.comp);

      both[1].forEach(function (r) {
        diag = diag.concat(r.diag);

      return Promise.all(empties.map(function (c) {
        return loadCompetition(c, addDays(dayKey, 1), addDays(dayKey, c.lookahead || 21), SLOW_TTL, " (próximos)");

        });
        state.events = events; state.failed = failed; state.failedIds = failedIds; state.diag = diag;
        state.results = results; state.upcoming = upcoming;

        render();
        if (showSkeleton) replay(document.getElementById("content"));
        schedule();
      });
    }).catch(function (err) {
      if (token !== state.token) return;
      if (window.console) console.error(err);

    });
  }

  function loadTables() {
    compsForTab().forEach(function (c) {
      if (!c.standings) { state.tables[c.id] = { none: true }; return; }
      var cur = state.tables[c.id];
      if (cur && (cur.loading || (cur.ok && Date.now() - cur.t < TABLE_TTL))) return;
      if (!cur || !cur.ok) state.tables[c.id] = { loading: true };
      fetchJson(ESPN_V2 + c.standings + "/standings", TABLE_TTL).then(function (data) {
        var groups = parseStandings(data);
        state.tables[c.id] = { ok: true, t: Date.now(), groups: groups };
        state.tableDiag[c.id] = { ok: true, text: groups.length + " tablas" };
        renderStandings();
      }).catch(function (err) {
        state.tables[c.id] = { error: String((err && err.message) || err) };
        state.tableDiag[c.id] = { ok: false, text: String((err && err.message) || err) };
        renderStandings();
      });
    });
    renderStandings();
  }

  function schedule() {
    clearTimeout(state.timer);
    var live = state.events.some(function (e) { return e.status === "live"; });
    state.timer = setTimeout(function () {
      if (document.hidden) return schedule();

  }

  function h(tag, attrs) {

  }
  var $ = function (id) { return document.getElementById(id); };

  function icon(name, cls) { return h("i", { "data-lucide": name, class: cls || "" }); }

  function replay(el) {
    if (!el) return;
    el.classList.remove("animate__animated", "animate__fadeInUp", "animate__faster");
    void el.offsetWidth;
    el.classList.add("animate__animated", "animate__fadeInUp", "animate__faster");
  }

  function flagImg(comp, cls) {
    var src = flagUrl(comp.flag, comp.color);
    if (!src) return null;

    img.addEventListener("error", function () { img.style.visibility = "hidden"; });
    return img;
  }

  function renderFilters() {
    var nav = $("filters");
    nav.textContent = "";
    TABS.forEach(function (t) {
      var comp = COMPETITIONS.filter(function (c) { return c.tab === t; })[0];
      var lead = comp ? flagImg(comp) : icon("layout-grid");
      var b = h("button", { type: "button", class: "filter-btn" + (t === state.tab ? " is-active" : "") }, lead, h("span", { text: t }));
      b.addEventListener("click", function () { setTab(t); });
      nav.appendChild(b);
    });
    var act = nav.querySelector(".is-active");
    if (act && act.scrollIntoView) { try { act.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {} }
  }

  function renderDays() {
    var box = $("days");
    box.classList.toggle("hidden", isRange());
    box.textContent = "";
    if (isRange()) return;
    var today = todayKey();
    for (var i = -3; i <= 3; i++) {
      (function (key) {
        var p = key.split("-");
        var lab = dayLabel(key);
        var sub = Number(p[2]) + "/" + Number(p[1]);
        var named = lab === "Hoy" || lab === "Mañana" || lab === "Ayer";
        var active = key === state.dayKey;
        var btn = h("button", { type: "button", class: "day-btn" + (active ? " is-active" : "") },
          h("small", { text: named ? sub : lab.split(" ")[0] }),
          h("strong", { text: named ? lab : sub })
        );
        btn.addEventListener("click", function () { state.dayKey = key; renderDays(); load(true); });
        box.appendChild(btn);
      })(addDays(today, i));
    }
  }

  function liveBadge() { return h("span", { class: "badge-live" }, "EN VIVO"); }
  function note(text) { return h("p", { class: "note", text: text }); }

  function matchRow(e, showDate) {
    var live = e.status === "live", upcoming = e.status === "upcoming", finished = e.status === "finished";
    var hs = parseFloat(e.home.score), as = parseFloat(e.away.score);
    var hWin = finished && (e.home.winner || hs > as);
    var aWin = finished && (e.away.winner || as > hs);

    function teamEl(t, away, win) {
      var name = h("span", { class: "name", text: t.name });
      var kids = [];
      if (t.logo) {
        var img = h("img", { src: t.logo, alt: "", loading: "lazy" });
        img.addEventListener("error", function () {
          if (t.flag && img.src.indexOf(t.flag) === -1) img.src = t.flag;
          else img.style.visibility = "hidden";
        });
        kids = away ? [name, img] : [img, name];
      } else { kids = [name]; }
      return h.apply(null, ["div", { class: "team" + (away ? " away" : "") + (win ? " is-winner" : "") }].concat(kids));
    }

    var score = h("div", { class: "score-box" });
    if (upcoming) {
      score.appendChild(h("span", { class: "score-vs", text: e.detail || "vs" }));
    } else {
      var hv = e.home.score != null && e.home.score !== "" ? e.home.score : "-";
      var av = e.away.score != null && e.away.score !== "" ? e.away.score : "-";
      score.appendChild(h("span", { class: "score-line", text: hv + " - " + av }));
      if (e.detail) score.appendChild(h("span", { class: "score-detail", text: e.detail }));
    }

    var meta = h("div", { class: "match-meta" },
      h("span", { class: "match-time", text: e.time }),
      showDate ? h("span", { class: "match-date-tag", text: dayLabel(e.dayKey) }) : null,
      e.venue ? h("span", { class: "match-venue", text: e.venue }) : null
    );

    return h("article", { class: "match" + (live ? " is-live" : "") },
      meta,
      h("div", { class: "match-body" }, teamEl(e.home, false, hWin), score, teamEl(e.away, true, aWin)));
  }

  function sectionTitle(comp, o) {
    o = o || {};
    var t = h("h2", { class: "section-title", style: "color:" + comp.color },
      flagImg(comp), h("span", { text: o.title || comp.label }));
    if (o.live) t.appendChild(liveBadge());
    if (o.count != null) t.appendChild(h("span", { class: "count", text: String(o.count) }));
    return t;
  }

  function daySection(comp, events, o) {
    o = o || {};
    var sec = h("section", {},
      sectionTitle(comp, { title: o.title, count: o.count, live: events.some(function (e) { return e.status === "live"; }) }));
    if (o.note) sec.appendChild(note(o.note));
    if (events.length) {
      var list = h("div", { class: "matches-list" });
      events.forEach(function (e) { list.appendChild(matchRow(e, o.showDate)); });
      sec.appendChild(list);
    }
    return sec;
  }

  function resultsBlock(comp) {
    var list = state.results
      .filter(function (e) { return e.comp.id === comp.id && e.dayKey !== state.dayKey; })
      .sort(function (a, b) { return b.ts - a.ts; })
      .slice(0, 5);

    var box = h("section", { class: "results-block" },
      h("h3", {}, icon("history"), comp.label + " · últimos resultados"));
    if (!list.length) {
      box.appendChild(h("p", { class: "results-empty", text: "Sin resultados en los últimos 30 días." }));
    } else {
      var wrap = h("div", { class: "matches-list" });
      list.forEach(function (e) { wrap.appendChild(matchRow(e, true)); });
      box.appendChild(wrap);
    }
    return box;
  }

  function render() {
    renderFilters();

    var content = $("content");
    content.textContent = "";

    if (!state.loaded) {
      for (var i = 0; i < 5; i++) content.appendChild(h("div", { class: "skeleton" }));
      refreshIcons();
      return;
    }

    var count = { live: 0, upcoming: 0, finished: 0 };
    state.events.forEach(function (e) { count[e.status]++; });
    $("statTotal").textContent = state.events.length;
    $("statLive").textContent = count.live;
    $("statUpcoming").textContent = count.upcoming;
    $("statFinished").textContent = count.finished;

    var w = $("warning");
    if (state.failed.length) {
      w.classList.remove("hidden");
      w.textContent = "No se pudieron cargar: " + state.failed.join(", ") + ". Se reintenta automáticamente.";
    } else { w.classList.add("hidden"); }

    renderDiag();
    $("updatedAt").textContent = state.updated ? "Última actualización: " + fmtTime.format(state.updated) : "";

    var list = state.events.filter(function (e) { return state.statusFilter === "all" || e.status === state.statusFilter; });

    if (isRange()) {
      if (!list.length) {
        content.appendChild(h("div", { class: "empty-state" },
          h("strong", { text: "No hay partidos de Los Pumas en este período" }),
          state.failed.length ? "No se pudo conectar con ESPN. Revisá tu conexión." : "Probá con otro filtro de estado."));
        refreshIcons();
        return;
      }
      var byDay = {};
      list.forEach(function (e) { (byDay[e.dayKey] = byDay[e.dayKey] || []).push(e); });
      Object.keys(byDay).sort().forEach(function (k) {
        var evs = byDay[k].sort(byTs);
        var wrap = h("div", { class: "comp-block" });
        wrap.appendChild(daySection(evs[0].comp, evs, { title: dayLabel(k) + " · " + evs[0].comp.label }));
        content.appendChild(wrap);
      });
      refreshIcons();
      return;
    }

    var any = false;
    compsForTab().forEach(function (comp) {
      var evs = list.filter(function (e) { return e.comp.id === comp.id; }).sort(byTs);
      var wrap = h("div", { class: "comp-block" });

      if (state.statusFilter !== "all") {
        if (!evs.length) return;
        wrap.appendChild(daySection(comp, evs, { count: evs.length }));
        content.appendChild(wrap); any = true;
        return;
      }

      if (evs.length) {
        wrap.appendChild(daySection(comp, evs, { count: evs.length }));
      } else if (state.failedIds[comp.id]) {
        wrap.appendChild(daySection(comp, [], { note: "No se pudo cargar. Se reintenta solo." }));
      } else {
        var next = state.upcoming[comp.id] || [];
        wrap.appendChild(daySection(comp, next, {
          showDate: true,
          note: next.length ? "Sin partidos este día. Próximos partidos:" : "Sin partidos este día ni en los próximos " + (comp.lookahead || 21) + " días."
        }));
      }
      if (!comp.noResults) wrap.appendChild(resultsBlock(comp));
      content.appendChild(wrap); any = true;
    });

    if (!any) {
      content.appendChild(h("div", { class: "empty-state" },
        h("strong", { text: "No hay partidos con ese estado" }), "Probá con otro filtro."));
    }
    refreshIcons();
  }

  function renderDiag() {
    var dl = $("diagList");
    dl.textContent = "";
    state.diag.forEach(function (d) {
      dl.appendChild(h("li", { class: d.ok ? "" : "error", text: (d.ok ? "OK · " : "Error · ") + d.name + " (" + d.src + "): " + d.text }));
    });
    compsForTab().forEach(function (c) {
      var d = state.tableDiag[c.id];
      if (d) dl.appendChild(h("li", { class: d.ok ? "" : "error", text: (d.ok ? "OK · " : "Error · ") + c.label + " (posiciones " + c.standings + "): " + d.text }));
    });
  }

  function standingsTable(group) {
    var head = h("tr", {},
      h("th", { class: "col-rank", text: "#" }),
      h("th", { class: "col-team", text: "Equipo" }));
    COLS.forEach(function (c) {
      head.appendChild(h("th", { class: c.wide ? "wide" : "", text: c.k }));
    });
    var tbody = h("tbody");
    var notes = {};
    group.rows.forEach(function (r, i) {
      if (r.note) notes[r.note.text] = r.note.color;
      var color = r.note && r.note.color ? (/^#/.test(r.note.color) ? r.note.color : "#" + r.note.color) : "transparent";
      var logo = r.logo ? h("img", { src: r.logo, alt: "", loading: "lazy" }) : null;
      if (logo) logo.addEventListener("error", function () { logo.style.visibility = "hidden"; });
      var tr = h("tr", {},
        h("td", { class: "col-rank", style: "box-shadow: inset 3px 0 0 " + color, text: String(i + 1) }),
        h("td", { class: "col-team" }, h("div", { class: "team-cell" }, logo, h("span", { text: r.name }))));
      COLS.forEach(function (c, j) {
        tr.appendChild(h("td", { class: (c.wide ? "wide " : "") + (c.strong ? "strong" : ""), text: r.cells[j] }));
      });
      tbody.appendChild(tr);
    });

    var table = h("table", { class: "standings-table" }, h("thead", {}, head), tbody);
    var wrap = h("div", { class: "standings-table-wrap" }, table);

    var legend = Object.keys(notes);
    var out = h("div", {}, wrap);
    if (legend.length) {
      var lg = h("ul", { class: "standings-legend" });
      legend.forEach(function (txt) {
        var col = notes[txt] ? (/^#/.test(notes[txt]) ? notes[txt] : "#" + notes[txt]) : "#64748b";
        lg.appendChild(h("li", {}, h("span", { class: "dot", style: "background:" + col }), txt));
      });
      out.appendChild(lg);
    }
    return out;
  }

  function renderStandings() {
    var box = $("standings");
    box.textContent = "";
    compsForTab().forEach(function (c) {
      var t = state.tables[c.id] || { loading: true };
      var det = h("details", { class: "standings-card", "data-comp": c.id });
      if (!state.closed[c.id]) det.setAttribute("open", "");
      det.addEventListener("toggle", function () { state.closed[c.id] = !det.open; });

      det.appendChild(h("summary", {},
        flagImg(c),
        h("span", { class: "comp-name", style: "color:" + c.color, text: c.label }),
        h("span", { class: "chev" }, icon("chevron-down"))));

      var body = h("div", { class: "standings-body" });
      if (t.none) {
        body.appendChild(h("p", { class: "standings-msg", text: c.noTable || "Sin tabla de posiciones." }));
      } else if (t.loading) {
        for (var i = 0; i < 4; i++) body.appendChild(h("div", { class: "skeleton", style: "margin: .75rem; height: 1.25rem;" }));
      } else if (t.error) {
        body.appendChild(h("p", { class: "standings-msg", text: "No se pudo cargar la tabla (" + t.error + "). Se reintenta al recargar." }));
      } else if (!t.groups.length) {
        body.appendChild(h("p", { class: "standings-msg", text: "Sin tabla disponible por ahora (puede ser una fase de eliminación directa)." }));
      } else {
        t.groups.forEach(function (g) {
          if (g.name && (t.groups.length > 1 || !/^(standings|table)$/i.test(g.name))) {
            body.appendChild(h("h4", { class: "group-title", text: g.name.replace(/^Group /i, "Grupo ") }));
          }
          body.appendChild(standingsTable(g));
        });
      }
      det.appendChild(body);
      box.appendChild(det);
    });
    refreshIcons();
  }

  function paintChips() {
    document.querySelectorAll("[data-status]").forEach(function (c) {
      c.classList.toggle("is-active", c.dataset.status === state.statusFilter);
    });
  }

  function setTab(t) {
    state.tab = t;
    state.statusFilter = "all";
    paintChips();
    try { history.replaceState(null, "", "#" + encodeURIComponent(t.toLowerCase())); } catch (e) {}
    renderDays();
    load(true);
    loadTables();
  }

  function tickClock() {
    var el = $("clock");
    if (el) el.textContent = dayLabel(todayKey()) + " · " + fmtTime.format(new Date()) + " ARG";
  }

  function init() {
    var hash = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    var found = TABS.filter(function (t) { return t.toLowerCase() === hash; })[0];
    if (found) state.tab = found;

    document.querySelectorAll("[data-status]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        state.statusFilter = chip.dataset.status;
        paintChips();
        render();
        replay($("content"));
      });
    });
    paintChips();

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { tickClock(); load(false); loadTables(); }
    });

    tickClock();
    setInterval(tickClock, 30000);
    renderFilters();
    renderDays();
    load(true);
    loadTables();
    refreshIcons();
  }

  init();
})();
  </script>
</body>
</html>
